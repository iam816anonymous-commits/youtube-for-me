_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:8081
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth

  - name: content-service
    url: http://content-service:8082
    routes:
      - name: content-routes
        paths:
          - /api/v1/videos

  - name: roadmap-service
    url: http://roadmap-service:8083
    routes:
      - name: roadmap-routes
        paths:
          - /api/v1/roadmaps
