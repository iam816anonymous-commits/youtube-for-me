_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:8081
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false

  - name: content-service
    url: http://content-service:8082
    routes:
      - name: content-routes
        paths:
          - /api/v1/videos
        strip_path: false

  - name: roadmap-service
    url: http://roadmap-service:8083
    routes:
      - name: roadmap-routes
        paths:
          - /api/v1/roadmaps
        strip_path: false

  - name: knowledge-service
    url: http://knowledge-service:8084
    routes:
      - name: knowledge-routes
        paths:
          - /api/v1/library
        strip_path: false

  - name: ai-service
    url: http://ai-service:8085
    routes:
      - name: ai-routes
        paths:
          - /api/v1/ai
        strip_path: false

  - name: youtube-sync-service
    url: http://youtube-sync-service:8086
    routes:
      - name: youtube-sync-routes
        paths:
          - /api/v1/youtube
        strip_path: false
